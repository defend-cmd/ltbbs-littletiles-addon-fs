plugins {
	id 'fabric-loom' version '1.6-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version + "-" + project.minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

sourceSets {
	verification
}

dependencies {
	verificationImplementation 'org.ow2.asm:asm-tree:9.6'
	verificationImplementation 'org.ow2.asm:asm-commons:9.6'
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modCompileOnly files(project.findProperty("bbs_fs_jar") ?: "libs/bbs-2.6-1.20.1.jar")
}

tasks.register('verifyRendering', JavaExec) {
	group = 'verification'
	description = 'Check mod APIs and original geometry without starting Minecraft.'
	dependsOn remapJar, verificationClasses
	classpath = sourceSets.verification.runtimeClasspath
	mainClass = 'com.kuboeb.ltbbs.RenderingContracts'
	doFirst {
		args = [
			file(project.findProperty('bbs_fs_jar') ?: 'libs/bbs-2.6-1.20.1.jar'),
			file(project.findProperty('littletiles_jar') ?: 'libs/LittleTiles.jar'),
			file(project.findProperty('creativecore_jar') ?: 'libs/CreativeCore.jar'),
			file(project.findProperty('verify_addon_jar') ?: remapJar.archiveFile.get().asFile),
			sourceSets.main.output.classesDirs.singleFile,
			sourceSets.main.compileClasspath.asPath
		]
	}
}

if (project.hasProperty('littletiles_jar') && project.hasProperty('creativecore_jar')) {
	check.dependsOn verifyRendering
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}
